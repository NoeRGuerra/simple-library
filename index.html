<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <p>Library</p>
    </header>
    <main>
        <button>Add book</button>
        <div class="books">
            <form action="" class="book-input card">
                <label for="title">Title</label>
                <input type="text" id="title" minlength="1" maxlength="100" required/>
                <label for="author">Author</label>
                <input type="text" id="author" minlength="1" maxlength="100" required/>
                <label for="pages">Pages</label>
                <input type="number" id="pages" min="1" max="9999" required/>
                <div>
                    <label for="read">Did you read it?</label>
                    <input type="checkbox" id="read" />
                </div>
                <button>Submit</button>
            </form>
            <div class="books-container">
            </div>
        </div>
    </main>
    <footer>
        <a href="https://github.com/NoeRGuerra/simple-library">Noé Reyes Guerra &copy; 2024.</a>
    </footer>
    <script src="script.js"></script>
</body>

</html>
